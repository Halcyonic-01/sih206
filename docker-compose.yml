# One command: docker compose up --build   ->   http://localhost:8010/
# Synthetic demo data only. Sign-in passwords are generated on first start and kept in the data volume:
#   docker compose exec web cat data/demo-credentials.txt data/authority-credentials.txt data/staff-credentials.txt
# Optional local mail catcher:  docker compose --profile mail up --build  (inbox at http://localhost:8025/)
services:
  web:
    build: .
    image: fdr-portal:local
    ports:
      - "${PORTAL_PORT:-8010}:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8010}
      SEED_DEMO: ${SEED_DEMO:-true}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-AICTE Deposit Portal <no-reply@localhost>}
    volumes:
      - portal-data:/app/data
    restart: unless-stopped

  # Daily rules and email retries from the same image (see docs/scheduled-rules.md).
  scheduler:
    image: fdr-portal:local
    depends_on:
      web:
        condition: service_healthy
    healthcheck:   # the image's HTTP check belongs to the web service; this one only proves the loop's container is alive
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.isdir('/app/data') else 1)"]
      interval: 30s
      retries: 3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DJANGO_SECRET_KEY" ]; then export DJANGO_SECRET_KEY="$$(cat data/.secret_key)"; fi
        while true; do
          python manage.py send_notifications || true
          stamp="data/.rules-ran-$$(date -u +%F)"
          if [ ! -f "$$stamp" ]; then
            python manage.py run_due_rules && touch "$$stamp" || true
          fi
          sleep 300
        done
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8010}
    volumes:
      - portal-data:/app/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "8025:8025"

volumes:
  portal-data:
