name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Production-profile deploy check
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-ci-only-not-a-real-secret-0123456789
          DJANGO_ALLOWED_HOSTS: example.org
          DJANGO_SECURE_COOKIES: 'true'
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_HSTS_SECONDS: '31536000'
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: React type-check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  fresh-install:
    name: Fresh install smoke (${{ matrix.os }})
    needs: [backend, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, start and probe the portal on one port
        run: python scripts/run_portal.py --smoke --port 8011

  docker:
    name: Docker Compose smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (waits for the health check)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: API and React shell respond
        run: |
          curl -fsS http://localhost:8010/api/health/
          curl -fsS http://localhost:8010/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8010/api/auth/me/)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
